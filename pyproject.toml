[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "a-team"
dynamic = ["version"]
description = "A team of persistent, learning agents, and the app you work with them in."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
# The core -- supervisor, MCP servers, transports, the CLI and host runners,
# the record and operator APIs -- is standard library only. The Antigravity
# SDK is needed only by the SDK runner (and sdk_agent/sdk_cli): install it
# with the `sdk` extra. The Claude runner needs the `claude` extra. `dev`
# includes both, so the whole suite runs.
dependencies = []

[project.optional-dependencies]
sdk = [
    "google-antigravity>=0.1.16",
    "google-genai>=1.0.0",
]
claude = [
    "claude-agent-sdk>=0.2.176",
]
dev = [
    "pytest>=8.0.0",
    "google-antigravity>=0.1.16",
    "google-genai>=1.0.0",
    "claude-agent-sdk>=0.2.176",
]

[project.scripts]
a-team = "ateam.cli:main"

[tool.setuptools.dynamic]
version = {attr = "ateam.__version__"}

# The plugin ships inside the package, so `python -m ateam.install_plugin`
# works from a plain install, with no checkout.
[tool.setuptools]
packages = ["ateam", "ateam.chat", "ateam.plugin"]

[tool.setuptools.package-dir]
"ateam.plugin" = "plugin"

[tool.setuptools.package-data]
"ateam.chat" = ["static/*"]
"ateam.plugin" = ["*.sh", "*.json", "a-team/*.json", "a-team/rules/**/*",
                    "a-team/skills/**/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["evals"]
# Run state, not tests. The live evals leave working directories under
# evals/ (all gitignored), and agents write proof files into them: after one
# delivery run `pytest evals/` collected five tests an agent had written, and
# the count no longer matched a fresh clone's.
norecursedirs = ["delivery_shared", "direct_shared", "reactive_sandbox", "reactive_durable",
                 "continuity_scratch", "ws_*", "team_*", "a2a_*", "*_unit",
                 ".a-team-shared", ".venv", "*.egg-info"]
filterwarnings = [
    # multiprocessing's own note about fork() in a threaded test process;
    # the race test forks on purpose and joins every child.
    "ignore:This process .* is multi-threaded, use of fork:DeprecationWarning",
    # The SDK's own validator reads its own deprecated field on every config,
    # whether or not the caller set it. We pass CompactionConfig.
    "ignore:CapabilitiesConfig.compaction_threshold is deprecated:DeprecationWarning",
]

